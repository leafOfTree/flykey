<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flykey 设置</title>
    <link rel="stylesheet" href="./popup.css" />
    <script type="module" src="./popup.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="../icon/128.png" width="36" height="36" alt="" />
        <div><strong>Flykey</strong><span>当前网站快捷键</span></div>
      </header>

      <section class="site-card" aria-labelledby="site-label">
        <span id="site-label">当前网站</span>
        <strong id="site-name">正在读取…</strong>
        <div class="setting-row">
          <div class="setting-copy">
            <span>按键映射</span>
            <strong id="state-label">正在读取…</strong>
          </div>
          <label class="switch" for="site-toggle">
            <input id="site-toggle" type="checkbox" role="switch" disabled />
            <span class="switch-track" aria-hidden="true"><span></span></span>
            <span class="sr-only">在当前网站启用按键映射</span>
          </label>
        </div>
      </section>

      <div class="popup-actions">
        <button id="open-command" type="button" disabled>打开命令面板</button>
        <button class="secondary" id="open-help" type="button">快捷键与使用帮助</button>
      </div>
      <p class="hint"><span>快捷键</span><kbd>;</kbd><span>只临时暂停当前页面，刷新后恢复。</span></p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
